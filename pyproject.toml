[project]
name = "khonliang-librarian-lib"
version = "0.1.0"
description = "Knowledge-owner contract for the khonliang librarian — SelfCatalog sqlite sidecar, index-card models, and catalog skills"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "jmespath>=1.0",
]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["librarian_lib*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
